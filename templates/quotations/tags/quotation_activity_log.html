{% if activities %}
<ul style="list-style:none;margin:0;padding:0;border-left:2px solid #c8a84b;">
  {% for row in activities %}
  <li style="margin:0 0 14px 18px;position:relative;">
    <span style="position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#1a4a2e;"></span>
    <div style="font-weight:600;color:#1a4a2e;">{{ row.action }}</div>
    <div style="font-size:12px;color:#64748b;">{{ row.created_at }}{% if row.created_by %} · {{ row.created_by }}{% endif %}</div>
    {% if row.description %}<div style="font-size:13px;margin-top:4px;color:#334155;">{{ row.description }}</div>{% endif %}
  </li>
  {% endfor %}
</ul>
{% else %}
<p style="color:#94a3b8;font-size:13px;">No activity recorded yet.</p>
{% endif %}
